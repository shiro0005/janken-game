# retry: workflow already exists on main, so this push triggers it
name: Apply true clue-shift crossword

on:
  push:
    paths:
      - .github/workflows/apply-game3-true-shift.yml

permissions:
  contents: write

jobs:
  update-game3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild two-stage crossword
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('game3/index.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace('<h2 id="acrossTitle">ヨコのカギ</h2>', '<h2 id="acrossTitle">カギ（1・3・5）</h2>')
          text = text.replace('<h2 id="downTitle">タテのカギ</h2>', '<h2 id="downTitle">カギ（2・4）</h2>')
          text = text.replace('</style>', '.image-card.secret-target.ready img{cursor:pointer;}\n</style>', 1)

          bootstrap_pattern = re.compile(r'const entries = \{[\s\S]*?function normalizeText\(value\) \{', re.M)
          bootstrap = r'''const stageDefinitions = [
      {
        rows: 9,
        columns: 9,
        entries: {
          across1: { number: 1, clue: "こえで物語を伝えるもの", answer: "ろうどく", cells: [[2,6],[3,6],[4,6],[5,6]] },
          down1: { number: 2, clue: "こけが生えるところ", answer: "いし", cells: [[5,3],[5,4]] },
          across2: { number: 3, clue: "こてを使う武道", answer: "けんどう", cells: [[4,4],[4,5],[4,6],[4,7]] },
          down2: { number: 4, clue: "こものを入れるもの", answer: "いれもの", cells: [[5,3],[6,3],[7,3],[8,3]] },
          across3: { number: 5, clue: "こけしそのもの", answer: "こけし", cells: [[3,4],[4,4],[5,4]] }
        }
      },
      {
        rows: 9,
        columns: 7,
        entries: {
          across1: { number: 1, clue: "えで物語を伝えるもの", answer: "かみしばい", cells: [[4,2],[4,3],[4,4],[4,5],[4,6]] },
          down1: { number: 2, clue: "けが生えるところ", answer: "あし", cells: [[7,0],[7,1]] },
          across2: { number: 3, clue: "てを使う武道", answer: "けんぽう", cells: [[6,1],[6,2],[6,3],[6,4]] },
          down2: { number: 4, clue: "ものを入れるもの", answer: "かばん", cells: [[4,2],[5,2],[6,2]] },
          across3: { number: 5, clue: "けしそのもの", answer: "けし", cells: [[6,1],[7,1]] }
        }
      }
    ];

    let stageIndex = 0;
    let entries = stageDefinitions[stageIndex].entries;
    const crossword = document.getElementById("crossword");
    const crosswordStage = document.getElementById("crosswordStage");
    const status = document.getElementById("status");
    const resetButton = document.getElementById("resetButton");
    const inputs = [...document.querySelectorAll(".answer-input")];
    const activeCells = new Set();
    const cellElements = new Map();
    const imageCards = new Map();
    const searchCache = new Map();
    const searchStates = new Map();

    function renderClues() {
      Object.entries(entries).forEach(([entryId, entry]) => {
        const label = document.querySelector(`label[for="${entryId}"]`);
        if (label) label.innerHTML = `<span class="clue-number">${entry.number}</span>${entry.clue}`;
      });
    }

    function updateInputDefinitions() {
      inputs.forEach(input => {
        const entry = entries[input.dataset.entry];
        input.maxLength = entry.answer.length;
        document.getElementById(`count-${input.dataset.entry}`).textContent = `0/${entry.answer.length}`;
      });
    }

    function renderBoard() {
      const stage = stageDefinitions[stageIndex];
      activeCells.clear();
      cellElements.clear();
      crossword.replaceChildren();
      crossword.style.gridTemplateColumns = `repeat(${stage.columns}, minmax(40px, 54px))`;
      crossword.style.gridTemplateRows = `repeat(${stage.rows}, minmax(40px, 54px))`;
      crossword.setAttribute("aria-label", `${stage.rows}行${stage.columns}列のクロスワード盤面`);

      const numberMap = new Map();
      Object.values(entries).forEach(entry => {
        entry.cells.forEach(([row, column]) => activeCells.add(`${row}-${column}`));
        const [startRow, startColumn] = entry.cells[0];
        const key = `${startRow}-${startColumn}`;
        if (!numberMap.has(key)) numberMap.set(key, []);
        numberMap.get(key).push(entry.number);
      });

      for (let row = 0; row < stage.rows; row += 1) {
        for (let column = 0; column < stage.columns; column += 1) {
          const key = `${row}-${column}`;
          const cell = document.createElement("div");
          cell.className = activeCells.has(key) ? "cell" : "cell block";
          cell.setAttribute("role", "gridcell");
          if (activeCells.has(key)) {
            cell.dataset.cell = key;
            if (numberMap.has(key)) {
              const number = document.createElement("span");
              number.className = "cell-number";
              number.textContent = numberMap.get(key).join("/");
              cell.appendChild(number);
            }
            const letter = document.createElement("span");
            letter.className = "cell-letter";
            cell.appendChild(letter);
            cellElements.set(key, { cell, letter });
          } else {
            cell.setAttribute("aria-hidden", "true");
          }
          crossword.appendChild(cell);
        }
      }
    }

    Object.entries(entries).forEach(([entryId, entry]) => {
      const figure = document.createElement("figure");
      figure.className = `image-card ${entryId}`;
      figure.innerHTML = `
        <div class="image-frame">
          <img alt="" decoding="async" referrerpolicy="no-referrer">
          <span class="image-placeholder">${entry.answer.length}文字で表示</span>
          <span class="image-spinner" aria-hidden="true"></span>
        </div>
        <figcaption>
          <span class="clue-number">${entry.number}</span>
          <span class="image-word">未入力</span>
          <a class="image-source" target="_blank" rel="noopener noreferrer" hidden>出典</a>
        </figcaption>
      `;
      crosswordStage.appendChild(figure);
      imageCards.set(entryId, {
        figure,
        image: figure.querySelector("img"),
        placeholder: figure.querySelector(".image-placeholder"),
        word: figure.querySelector(".image-word"),
        source: figure.querySelector(".image-source")
      });
    });

    function allAnswersCorrect() {
      return inputs.every(input => {
        const entry = entries[input.dataset.entry];
        return normalizeText(input.value).join("") === entry.answer;
      });
    }

    function activateSecondCrossword() {
      if (stageIndex !== 0 || !allAnswersCorrect()) return;
      stageIndex = 1;
      entries = stageDefinitions[stageIndex].entries;
      searchCache.clear();
      renderClues();
      updateInputDefinitions();
      renderBoard();
      clearAllInputs(false);
      status.textContent = "カギから『こ』が消え、答えと盤面が変わりました。もう一度解いてください。";
      inputs[0].focus();
    }

    const secretCard = imageCards.get("across3");
    if (secretCard) {
      secretCard.figure.classList.add("secret-target");
      secretCard.image.addEventListener("click", activateSecondCrossword);
    }

    function normalizeText(value) {'''
          text, count = bootstrap_pattern.subn(lambda m: bootstrap, text, count=1)
          if count != 1:
              raise SystemExit('bootstrap block not found')

          input_pattern = re.compile(r'function updateInputState\(input\) \{[\s\S]*?\n    \}\n\n    function updateStatus', re.M)
          new_input = r'''function updateInputState(input) {
      const entryId = input.dataset.entry;
      const entry = entries[entryId];
      const characters = normalizeText(input.value);
      const maxLength = entry.answer.length;
      input.maxLength = maxLength;
      if (characters.length > maxLength) input.value = characters.slice(0, maxLength).join("");
      const current = normalizeText(input.value);
      document.getElementById(`count-${entryId}`).textContent = `${current.length}/${maxLength}`;
      const filled = current.length === maxLength;
      const correct = current.join("") === entry.answer;
      input.classList.toggle("complete", filled && correct);
      input.classList.toggle("wrong", filled && !correct);
    }

    function updateStatus'''
          text, count = input_pattern.subn(lambda m: new_input, text, count=1)
          if count != 1:
              raise SystemExit('updateInputState block not found')

          status_pattern = re.compile(r'function updateStatus\(\) \{[\s\S]*?\n    \}\n\n    function refresh', re.M)
          new_status = r'''function updateStatus() {
      const allFilled = inputs.every(input => {
        const entry = entries[input.dataset.entry];
        return normalizeText(input.value).length === entry.answer.length;
      });
      const allCorrect = allAnswersCorrect();
      status.classList.toggle("clear", allCorrect && stageIndex === 1);

      const secretCard = imageCards.get("across3");
      if (secretCard) {
        secretCard.image.title = allCorrect && stageIndex === 0 ? "クリック" : "";
      }

      if (allCorrect) {
        status.textContent = stageIndex === 0
          ? "クロスワードは完成しました。ただし、まだ終わりではありません。"
          : "クリア！ 『こ』が消えた後の別のクロスワードも完成です。";
      } else if (stageIndex === 1) {
        status.textContent = "『こ』が消えたカギで、別のクロスワードを完成させてください。";
      } else if (allFilled) {
        status.textContent = "交差する文字や答えをもう一度確認してください。";
      } else {
        status.textContent = "カギの入力欄は、指定された文字数まで入力できます。";
      }
    }

    function refresh'''
          text, count = status_pattern.subn(lambda m: new_status, text, count=1)
          if count != 1:
              raise SystemExit('updateStatus block not found')

          tail_pattern = re.compile(r'function clearAllInputs\(focusFirst = true\) \{[\s\S]*?inputs\[0\]\.focus\(\);', re.M)
          new_tail = r'''function clearAllInputs(focusFirst = true) {
      inputs.forEach(input => {
        cancelSearch(input.dataset.entry);
        input.value = "";
        setCardEmpty(input.dataset.entry, `${entries[input.dataset.entry].answer.length}文字で表示`);
      });
      refresh();
      if (focusFirst) inputs[0].focus();
    }

    resetButton.addEventListener("click", () => clearAllInputs());
    renderClues();
    updateInputDefinitions();
    renderBoard();
    refresh();
    inputs[0].focus();'''
          text, count = tail_pattern.subn(lambda m: new_tail, text, count=1)
          if count != 1:
              raise SystemExit('tail block not found')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate JavaScript and commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('game3/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', text)
          Path('/tmp/game3.js').write_text('\n'.join(scripts[1:]), encoding='utf-8')
          PY
          node --check /tmp/game3.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game3/index.html
          git commit -m "Make clue removal create a second crossword"
          git push
