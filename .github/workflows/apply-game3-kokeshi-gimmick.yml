name: Apply game3 kokeshi gimmick

on:
  push:
    paths:
      - .github/workflows/apply-game3-kokeshi-gimmick.yml

permissions:
  contents: write

jobs:
  update-game3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game3
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("game3/index.html")
          text = path.read_text(encoding="utf-8")

          entries_pattern = re.compile(r'const entries = \{[\s\S]*?\n\};\nconst clueNumbers')
          new_entries = '''const entries = {
          across1: {
          number: 1,
          direction: "across",
          clue: "キャンプで木を燃やして作る火。こ",
          answer: "たきび",
          cells: [[0, 1], [0, 2], [0, 3]]
          },
          down1: {
          number: 2,
          direction: "down",
          clue: "森で見つかる、かさの形をした食べ物。こ",
          answer: "きのこ",
          cells: [[0, 2], [1, 2], [2, 2]]
          },
          across2: {
          number: 3,
          direction: "across",
          clue: "東北の土産として有名な木の人形。こ",
          answer: "こけし",
          cells: [[2, 2], [2, 3], [2, 4]]
          },
          down2: {
          number: 4,
          direction: "down",
          clue: "カメラで記録するもの。こ",
          answer: "しゃしん",
          cells: [[2, 4], [3, 4], [4, 4], [5, 4]]
          },
          across3: {
          number: 5,
          direction: "across",
          clue: "オレンジ色で甘い冬の果物。こ",
          answer: "みかん",
          cells: [[5, 2], [5, 3], [5, 4]]
          }
          };
          const clueNumbers'''
          text, count = entries_pattern.subn(new_entries, text, count=1)
          if count != 1:
              raise SystemExit("entries block not found")

          marker = 'const searchStates = new Map();\n'
          if marker not in text:
              raise SystemExit("searchStates marker not found")
          secret_code = '''const searchStates = new Map();
          const secretShift = {
          active: false,
          entryId: "across2",
          character: "こ"
          };
          Object.values(entries).forEach(entry => {
          entry.baseClue = entry.clue;
          });
          function renderClues() {
          Object.entries(entries).forEach(([entryId, entry]) => {
          entry.clue = secretShift.active
          ? entry.baseClue.split(secretShift.character).join("")
          : entry.baseClue;
          const label = document.querySelector(`label[for="${entryId}"]`);
          if (!label) return;
          label.innerHTML = `<span class="clue-number">${entry.number}</span>${entry.clue}`;
          });
          }
          function allAnswersCorrect() {
          return inputs.every(input => {
          const entry = entries[input.dataset.entry];
          return normalizeText(input.value).join("") === entry.answer;
          });
          }
          '''
          text = text.replace(marker, secret_code, 1)

          cards_marker = '});\nfunction normalizeText(value) {'
          if cards_marker not in text:
              raise SystemExit("image card marker not found")
          click_code = '''});
          const secretCard = imageCards.get(secretShift.entryId);
          if (secretCard) {
          secretCard.figure.classList.add("secret-target");
          secretCard.image.addEventListener("click", () => {
          if (secretShift.active || !allAnswersCorrect()) return;
          secretShift.active = true;
          searchCache.clear();
          renderClues();
          clearAllInputs(false);
          status.textContent = "文字がひとつ消えました。もう一度クロスワードを解いてください。";
          inputs[0].focus();
          });
          }
          function normalizeText(value) {'''
          text = text.replace(cards_marker, click_code, 1)

          text = text.replace(
              '.image-card.ready img{display:block;}',
              '.image-card.ready img{display:block;}.image-card.secret-target.ready img{cursor:pointer;}',
              1
          )

          status_pattern = re.compile(r'function updateStatus\(\) \{[\s\S]*?\n\}\nfunction refresh')
          new_status = '''function updateStatus() {
          const allFilled = inputs.every(input => {
          const entry = entries[input.dataset.entry];
          return normalizeText(input.value).length === entry.answer.length;
          });
          const allCorrect = allAnswersCorrect();
          status.classList.toggle("clear", allCorrect && secretShift.active);
          if (allCorrect) {
          status.textContent = secretShift.active
          ? "クリア！ 文字が消えた後のクロスワードも完成です。"
          : "クロスワードは完成しました。ただし、まだ終わりではありません。";
          } else if (secretShift.active) {
          status.textContent = "文字がひとつ消えています。もう一度クロスワードを解いてください。";
          } else if (allFilled) {
          status.textContent = "交差する文字や答えをもう一度確認してください。";
          } else {
          status.textContent = "カギの入力欄は、指定された文字数まで入力できます。";
          }
          }
          function refresh'''
          text, count = status_pattern.subn(new_status, text, count=1)
          if count != 1:
              raise SystemExit("updateStatus block not found")

          reset_pattern = re.compile(r'resetButton\.addEventListener\("click", \(\) => \{[\s\S]*?\n\}\);\nrefresh\(\);')
          new_reset = '''function clearAllInputs(focusFirst = true) {
          inputs.forEach(input => {
          cancelSearch(input.dataset.entry);
          input.value = "";
          setCardEmpty(input.dataset.entry, `${entries[input.dataset.entry].answer.length}文字で表示`);
          });
          refresh();
          if (focusFirst) inputs[0].focus();
          }
          resetButton.addEventListener("click", () => {
          clearAllInputs();
          });
          renderClues();
          refresh();'''
          text, count = reset_pattern.subn(new_reset, text, count=1)
          if count != 1:
              raise SystemExit("reset block not found")

          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit game3 update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game3/index.html
          git commit -m "Add kokeshi clue removal gimmick"
          git push
