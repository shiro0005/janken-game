name: Apply game3 notation update
on:
  push:
    paths:
      - ".github/workflows/apply-game3-notation-update.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace game3 and remove one-time workflow
        env:
          GAME3_GZIP_BASE64: 
        run: |
          python - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          data = gzip.decompress(base64.b64decode(os.environ["GAME3_GZIP_BASE64"]))
          Path("game3/index.html").write_bytes(data)
          Path(".github/workflows/apply-game3-notation-update.yml").unlink()
          PY
      - name: Commit updated game3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve Irasutoya notation variant search"
          git push origin HEAD:main
