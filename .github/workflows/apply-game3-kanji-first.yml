name: Apply game3 kanji-first search

on:
  push:
    paths:
      - .github/workflows/apply-game3-kanji-first.yml

permissions:
  contents: write

jobs:
  update-game3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prioritize kanji notation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("game3/index.html")
          text = path.read_text(encoding="utf-8")
          old = '''async function searchIrasutoya(query, clue, signal) {
          const tried = new Set();
          const tryTerms = async terms => {
          for (const searchTerm of terms) {
          if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
          const key = normalizeSearchText(searchTerm);
          if (!key || tried.has(key)) continue;
          tried.add(key);
          const result = await searchIrasutoyaOnce(searchTerm, query, clue);
          if (result) return result;
          }
          return null;
          };
          let result = await tryTerms(buildLocalNotationVariants(query));
          if (result) return result;
          const discoveredVariants = await discoverWikipediaNotationVariants(query, clue, signal);
          result = await tryTerms(discoveredVariants);
          return result;
          }'''
          new = '''function prioritizeKanjiTerms(terms, originalQuery) {
          const normalizedOriginal = normalizeSearchText(originalQuery);
          const originalHasKanji = /\\p{Script=Han}/u.test(originalQuery);
          const unique = uniqueSearchTerms(terms);
          const exact = [];
          const kanji = [];
          const kana = [];
          const other = [];
          unique.forEach(term => {
          const normalized = normalizeSearchText(term);
          if (normalized === normalizedOriginal) {
          exact.push(term);
          return;
          }
          if (/\\p{Script=Han}/u.test(term)) {
          kanji.push(term);
          return;
          }
          if (/[ぁ-ゖァ-ヶ]/.test(term)) {
          kana.push(term);
          return;
          }
          other.push(term);
          });
          return originalHasKanji
          ? [...exact, ...kanji, ...kana, ...other]
          : [...kanji, ...exact, ...kana, ...other];
          }
          async function searchIrasutoya(query, clue, signal) {
          const tried = new Set();
          const tryTerms = async terms => {
          for (const searchTerm of terms) {
          if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
          const key = normalizeSearchText(searchTerm);
          if (!key || tried.has(key)) continue;
          tried.add(key);
          const result = await searchIrasutoyaOnce(searchTerm, query, clue);
          if (result) return result;
          }
          return null;
          };
          const discoveredVariants = await discoverWikipediaNotationVariants(query, clue, signal);
          let result = await tryTerms(prioritizeKanjiTerms(discoveredVariants, query));
          if (result) return result;
          result = await tryTerms(prioritizeKanjiTerms(buildLocalNotationVariants(query), query));
          return result;
          }'''
          if old not in text:
              raise SystemExit("Target game3 search block was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit game3 update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game3/index.html
          git commit -m "Prioritize kanji in Irasutoya search"
          git push