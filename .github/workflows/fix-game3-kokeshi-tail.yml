name: Fix game3 kokeshi script tail

on:
  push:
    paths:
      - .github/workflows/fix-game3-kokeshi-tail.yml

permissions:
  contents: write

jobs:
  fix-game3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale script tail
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("game3/index.html")
          text = path.read_text(encoding="utf-8")
          old = '''renderClues();
          refresh();
          inputs[0].focus();
          });
          refresh();'''
          new = '''renderClues();
          refresh();
          inputs[0].focus();'''
          if old not in text:
              raise SystemExit("stale script tail not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("game3/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html)
          Path("/tmp/game3-script.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/game3-script.js
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game3/index.html
          git commit -m "Fix kokeshi crossword script tail"
          git push
