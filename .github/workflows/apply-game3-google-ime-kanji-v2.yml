name: Apply Google IME kanji conversion v2

on:
  push:
    paths:
      - .github/workflows/apply-game3-google-ime-kanji-v2.yml

permissions:
  contents: write

jobs:
  update-game3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Wikipedia kanji extraction with Google IME
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("game3/index.html")
          text = path.read_text(encoding="utf-8")

          start = text.find("function extractKanjiTerms")
          end = text.find("async function searchIrasutoyaOnce", start)
          if start < 0 or end < 0:
              raise SystemExit("Wikipedia kanji extraction block was not found")

          replacement = r'''function googleImeJsonpRequest(text, timeoutMs = 7000) {
          return new Promise((resolve, reject) => {
          const callbackName = `googleImeJsonp_${Date.now()}_${Math.random().toString(36).slice(2)}`;
          const script = document.createElement("script");
          let settled = false;
          const cleanup = () => {
          if (script.parentNode) script.parentNode.removeChild(script);
          try { delete window[callbackName]; } catch (_) { window[callbackName] = undefined; }
          };
          const timer = window.setTimeout(() => {
          if (settled) return;
          settled = true;
          cleanup();
          reject(new Error("Googleかな漢字変換がタイムアウトしました"));
          }, timeoutMs);
          window[callbackName] = data => {
          if (settled) return;
          settled = true;
          window.clearTimeout(timer);
          cleanup();
          resolve(data);
          };
          script.onerror = () => {
          if (settled) return;
          settled = true;
          window.clearTimeout(timer);
          cleanup();
          reject(new Error("Googleかな漢字変換を読み込めませんでした"));
          };
          const endpoint = new URL("https://www.google.com/transliterate");
          endpoint.searchParams.set("langpair", "ja-Hira|ja");
          endpoint.searchParams.set("text", text);
          endpoint.searchParams.set("jsonp", callbackName);
          endpoint.searchParams.set("callback", callbackName);
          script.src = endpoint.toString();
          document.head.appendChild(script);
          });
          }
          function combineGoogleImeCandidates(data) {
          if (!Array.isArray(data)) return [];
          let combinations = [""];
          for (const segment of data) {
          if (!Array.isArray(segment) || !Array.isArray(segment[1])) continue;
          const candidates = segment[1]
          .map(value => String(value || "").normalize("NFKC").trim())
          .filter(Boolean)
          .slice(0, 8);
          if (!candidates.length) continue;
          const next = [];
          for (const prefix of combinations) {
          for (const candidate of candidates) {
          next.push(prefix + candidate);
          if (next.length >= 40) break;
          }
          if (next.length >= 40) break;
          }
          combinations = next;
          }
          return uniqueSearchTerms(combinations)
          .filter(candidate => /\p{Script=Han}/u.test(candidate))
          .slice(0, 12);
          }
          async function discoverGoogleKanjiVariants(query, signal) {
          if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
          const normalized = String(query || "").normalize("NFKC").replace(/[\s　]/g, "");
          if (!normalized || /\p{Script=Han}/u.test(normalized)) return [normalized].filter(Boolean);
          const hiragana = toHiragana(normalized);
          if (!/^[ぁ-ゖー]+$/.test(hiragana)) return [];
          const data = await googleImeJsonpRequest(hiragana);
          if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
          return combineGoogleImeCandidates(data);
          }
          '''
          text = text[:start] + replacement + text[end:]

          order_start = text.find("const discoveredVariants = await discoverWikipediaNotationVariants(query, clue, signal);")
          if order_start < 0:
              raise SystemExit("Old Wikipedia search order was not found")
          order_end = text.find("return result;", order_start)
          if order_end < 0:
              raise SystemExit("Old search order end was not found")
          order_end += len("return result;")

          new_order = r'''let result = null;
          if (!/\p{Script=Han}/u.test(query)) {
          try {
          const googleKanjiVariants = await discoverGoogleKanjiVariants(query, signal);
          result = await tryTerms(googleKanjiVariants);
          if (result) return result;
          } catch (error) {
          if (error.name === "AbortError") throw error;
          console.warn("Googleかな漢字変換に失敗しました", error);
          }
          }
          result = await tryTerms(prioritizeKanjiTerms(buildLocalNotationVariants(query), query));
          return result;'''
          text = text[:order_start] + new_order + text[order_end:]
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit game3 update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game3/index.html
          git commit -m "Use Google IME for kanji candidates"
          git push
