name: Clean Google IME game3 patch

on:
  push:
    paths:
      - .github/workflows/apply-game3-google-ime-kanji-v2.yml

permissions:
  contents: write

jobs:
  cleanup-game3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate fallback lines
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("game3/index.html")
          text = path.read_text(encoding="utf-8")
          duplicate = '''result = await tryTerms(prioritizeKanjiTerms(buildLocalNotationVariants(query), query));
          return result;
          result = await tryTerms(prioritizeKanjiTerms(buildLocalNotationVariants(query), query));
          return result;'''
          single = '''result = await tryTerms(prioritizeKanjiTerms(buildLocalNotationVariants(query), query));
          return result;'''
          if duplicate not in text:
              raise SystemExit("Duplicate fallback block was not found")
          path.write_text(text.replace(duplicate, single, 1), encoding="utf-8")
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game3/index.html
          git commit -m "Clean Google IME search fallback"
          git push
