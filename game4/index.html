<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>ゲームの文字計算</title>
  <script>
    (() => {
      const localPreview = location.protocol === "file:";
      if (!localPreview && sessionStorage.getItem("game4Unlocked") !== "true") location.replace("../");
    })();
  </script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="page">
    <header class="heading">
      <p class="game-number">GAME 4</p>
      <h1>ゲームの文字計算</h1>
      <p>3つの式を手がかりに、最後の式が表す言葉を見つけてください。</p>
    </header>

    <section class="panel equation-board" aria-label="手がかりとなる3つの式">
      <div id="examples" class="example-list"></div>
    </section>

    <section class="panel challenge-panel" aria-labelledby="challengeTitle">
      <h2 id="challengeTitle">問題</h2>
      <div id="challenge"></div>
      <p class="input-note">答えはひらがな4文字で入力してください。</p>
      <p id="status" class="status" aria-live="polite">式が表す言葉を考えてください。</p>
      <button id="resetButton" class="reset-button" type="button">答えをリセット</button>
    </section>

    <section id="clearPanel" class="clear-panel" aria-live="assertive" hidden>
      <div class="clear-icon" aria-hidden="true">✨</div>
      <h2>ゲーム4 クリア！</h2>
    </section>
  </main>
  <script src="./game.js"></script>
</body>
</html>
