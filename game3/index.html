<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>クロスワードクイズ</title>
<script>
(() => {
  const localPreview = location.protocol === "file:";
  if (!localPreview && sessionStorage.getItem("game3Unlocked") !== "true") {
    location.replace("../");
  }
})();
</script>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./final-answer.css">
<link rel="stylesheet" href="./tanuki.css">
</head>
<body>
<main class="page">
  <header class="heading">
    <p class="game-number">GAME 3</p>
    <h1>クロスワードクイズ</h1>
    <p>カギに合う言葉を入力してください。入力した文字は中央のパズルへ反映されます。</p>
  </header>

  <section class="game-panel">
    <p id="hiraganaHelp" class="input-rule">答えはひらがなで入力してください。漢字・カタカナ・英数字・記号は入力できません。</p>
    <div class="layout">
      <section class="clue-panel">
        <h2>カギ（1・3・5）</h2>
        <div id="leftClues" class="clue-list"></div>
      </section>

      <section class="board-area">
        <div class="puzzle-heading">
          <h2>問題</h2>
          <!-- 出典: いらすとや「狸のイラスト」 https://www.irasutoya.com/2015/03/blog-post_346.html -->
          <button id="tanukiButton" class="tanuki-button" type="button" aria-label="タヌキのイラスト">
            <img id="tanukiImage" alt="タヌキのイラスト" decoding="async">
          </button>
        </div>
        <div id="crosswordStage" class="crossword-stage">
          <div id="crossword" class="crossword" role="grid"></div>
        </div>
        <p id="status" class="status" aria-live="polite"></p>
        <div class="final-answer">
          <p class="final-answer-label">囲みの文字カードを並べ替えてできる言葉</p>
          <ol class="card-instructions" aria-label="文字カードの操作方法">
            <li>カードを選ぶ</li>
            <li>入れたい枠を選ぶ</li>
            <li>5文字を並べる</li>
          </ol>
          <p class="card-area-label">文字カード</p>
          <div id="letterCards" class="letter-cards" aria-label="文字カード"></div>
          <p class="card-area-label">答えの枠</p>
          <div id="answerSlots" class="answer-slots" aria-label="文字カードをはめる枠"></div>
          <p class="card-secondary-help">やり直すときは、枠のカードをもう一度押すと戻せます。</p>
          <p id="letterCardsHint" class="letter-cards-hint">囲みのマスに文字が入ると、文字カードが現れます。</p>
        </div>
      </section>

      <section class="clue-panel">
        <h2>カギ（2・4）</h2>
        <div id="rightClues" class="clue-list"></div>
      </section>
    </div>

    <div class="controls">
      <button id="resetButton" type="button">入力をリセット</button>
    </div>
  </section>
</main>
<script src="./search.js"></script>
<script src="./game.js"></script>
</body>
</html>
