:2;grid-row:2;z-index:2;display:grid;grid-template-columns:repeat(5,minmax(44px,58px));grid-template-rows:repeat(6,minmax(44px,58px));gap:3px;padding:10px;border-radius:16px;background:#263238;}.cell{position:relative;display:grid;place-items:center;border-radius:5px;background:#fff;font-size:clamp(22px,4vw,31px);font-weight:800;line-height:1;}.cell.block{background:#263238;}.cell.conflict{background:#ffe2df;color:#b3261e;}.cell-number{position:absolute;top:3px;left:4px;color:#59636f;font-size:10px;font-weight:800;line-height:1;}.image-card{z-index:3;width:104px;margin:0;padding:6px;border:1px solid #d9e0e9;border-radius:14px;background:#fff;box-shadow:0 8px 20px rgba(35,55,80,0.12);overflow:hidden;}.image-card.across1{grid-column:2;grid-row:1;}.image-card.down1{grid-column:1;grid-row:2;align-self:start;margin-top:5px;}.image-card.across2{grid-column:3;grid-row:2;align-self:start;margin-top:58px;}.image-card.down2{grid-column:3;grid-row:2;align-self:end;margin-bottom:6px;}.image-card.across3{grid-column:2;grid-row:3;}.image-frame{width:90px;height:68px;display:grid;place-items:center;border-radius:10px;background:#eef2f7;overflow:hidden;}.image-frame img{display:none;width:100%;height:100%;object-fit:contain;background:#fff;}.image-card.ready img{display:block;}.image-placeholder{padding:5px;color:#788390;font-size:12px;font-weight:800;text-align:center;}.image-card.ready .image-placeholder,.image-card.loading .image-placeholder{display:none;}.image-spinner{display:none;width:24px;height:24px;border:3px solid rgba(75,123,236,0.2);border-top-color:#4b7bec;border-radius:50%;animation:image-spin .75s linear infinite;}.image-card.loading .image-spinner{display:block;}@keyframes image-spin{to{transform:rotate(360deg);}}.image-card figcaption{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px;align-items:center;margin-top:5px;font-size:11px;}.image-word{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800;}.image-source{grid-column:1 / -1;justify-self:end;color:#4b66a5;font-size:10px;text-decoration:none;}.image-source:hover{text-decoration:underline;}.status{min-height:24px;text-align:center;}.status.clear{color:#188038;font-weight:800;}.controls{display:flex;justify-content:center;margin-top:22px;}.reset-button{border:0;border-radius:12px;padding:11px 22px;background:#eef2f7;color:#4f5a67;font-weight:700;cursor:pointer;}@media (max-width:1080px){.layout{grid-template-columns:1fr 1fr;}.board-area{grid-column:1 / -1;grid-row:1;}}@media (max-width:620px){body{padding:14px;}.game-panel{padding:16px;}.layout{grid-template-columns:1fr;}.board-area{grid-column:auto;grid-row:auto;}.crossword-stage{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto;width:100%;}.crossword{grid-column:1 / -1;grid-row:1;grid-template-columns:repeat(5,minmax(42px,54px));grid-template-rows:repeat(6,minmax(42px,54px));}.image-card{width:100%;display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;align-items:center;}.image-frame{width:76px;height:62px;}.image-card.across1,.image-card.down1,.image-card.across2,.image-card.down2,.image-card.across3{grid-column:auto;grid-row:auto;align-self:auto;margin:0;}.image-card.across1,.image-card.across2{grid-column:1;}.image-card.down1,.image-card.down2{grid-column:2;}.image-card.across3{grid-column:1 / -1;width:calc(50% - 5px);justify-self:center;}.image-card figcaption{margin:0;}}@media (max-width:370px){.crossword{grid-template-columns:repeat(5,40px);grid-template-rows:repeat(6,40px);gap:2px;padding:7px;}}</style>

<body>
<main class="page">
<header class="heading">
<h1>クロスワードクイズ</h1>
<p class="instruction">カギに合う言葉を入力してください。入力した文字は中央のパズルへ反映されます。</p>
</header>
<section class="game-panel">
<div class="layout">
<section class="clue-panel" aria-labelledby="acrossTitle">
<h2 id="acrossTitle">ヨコのカギ</h2>
<div class="clue-list">

<span class="clue-number">1</span>春に咲く代表的な花
</label>
<div class="answer-wrap">

</div>
</div>
<div class="clue">
<label class="clue-label" for="across2">
<span class="clue-number">3</span>寿司や刺身で人気の赤身魚
</label>
<div class="answer-wrap">
<input id="across2" class="answer-input" type="text" inputmode="text" autocomplete="off" maxlength="3" data-entry="across2" aria-describedby="count-across2">
<span class="char-count" id="count-across2">0/3</span>
</div>
</div>
<div class="clue">
<label class="clue-label" for="across3">
<span class="clue-number">5</span>牛乳を表す外来語
</label>
<div class="answer-wrap">
<input id="across3" class="answer-input" type="text" inputmode="text" autocomplete="off" maxlength="3" data-entry="across3" aria-describedby="count-across3">

</div>
</div>
</div>
</section>
<section class="board-area" aria-labelledby="boardTitle">
<h2 class="board-title" id="boardTitle">パズル</h2>
<div class="crossword-stage" id="crosswordStage">
<div class="crossword" id="crossword" role="grid" aria-label="6行5列のクロスワード盤面"></div>
</div>
<p class="status" id="status" aria-live="polite">カギの入力欄は、指定された文字数まで入力できます。</p>
</section>
<section class="clue-panel" aria-labelledby="downTitle">
<h2 id="downTitle">タテのカギ</h2>
<div class="clue-list">
<div class="clue">
<label class="clue-label" for="down1">
<span class="clue-number">2</span>道路を走る乗り物
</label>
<div class="answer-wrap">
<input id="down1" class="answer-input" type="text" inputmode="text" autocomplete="off" maxlength="3" data-entry="down1" aria-describedby="count-down1">
<span class="char-count" id="count-down1">0/3</span>
</div>
</div>
<div class="clue">
<label class="clue-label" for="down2">
<span class="clue-number">4</span>火をつけて明かりにするもの
</label>
<div class="answer-wrap">
<input id="down2" class="answer-input" type="text" inputmode="text" autocomplete="off" maxlength="4" data-entry="down2" aria-describedby="count-down2">
<span class="char-count" id="count-down2">0/4</span>
</div>
</div>
</div>
</section>
</div>
<div class="controls">
<button class="reset-button" id="resetButton" type="button">入力をリセット</button>
</div>
</section>
</main>
<script>
const entries = {
across1: {
number: 1,
direction: "across",
clue: "春に咲く代表的な花",
answer: "さくら",
cells: [[0, 1], [0, 2], [0, 3]]
},
down1: {
number: 2,
direction: "down",
clue: "道路を走る乗り物",
answer: "くるま",
cells: [[0, 2], [1, 2], [2, 2]]
},
across2: {
number: 3,
direction: "across",
clue: "寿司や刺身で人気の赤身魚",
answer: "まぐろ",
cells: [[2, 2], [2, 3], [2, 4]]
},
down2: {
number: 4,
direction: "down",
clue: "火をつけて明かりにするもの",
answer: "ろうそく",
cells: [[2, 4], [3, 4], [4, 4], [5, 4]]
},
across3: {
number: 5,
direction: "across",
clue: "牛乳を表す外来語",
answer: "みるく",
cells: [[5, 2], [5, 3], [5, 4]]
}
};
const clueNumbers = {
"0-1": "1",
"0-2": "2",
"2-2": "3",
"2-4": "4",
"5-2": "5"
};
const rows = 6;
const columns = 5;
const crossword = document.getElementById("crossword");
const crosswordStage = document.getElementById("crosswordStage");
const status = document.getElementById("status");
const resetButton = document.getElementById("resetButton");
const inputs = [...document.querySelectorAll(".answer-input")];
const activeCells = new Set();
const cellElements = new Map();
const imageCards = new Map();
const searchCache = new Map();
const searchStates = new Map();
Object.values(entries).forEach(entry => {
entry.cells.forEach(([row, column]) => activeCells.add(`${row}-${column}`));
});
for (let row = 0; row < rows; row += 1) {
for (let column = 0; column < columns; column += 1) {
const key = `${row}-${column}`;
const cell = document.createElement("div");
cell.className = activeCells.has(key) ? "cell" : "cell block";
cell.setAttribute("role", "gridcell");
if (activeCells.has(key)) {
cell.dataset.cell = key;
if (clueNumbers[key]) {
const number = document.createElement("span");
number.className = "cell-number";
number.textContent = clueNumbers[key];
cell.appendChild(number);
}
const letter = document.createElement("span");
letter.className = "cell-letter";
cell.appendChild(letter);
cellElements.set(key, { cell, letter });
} else {
cell.setAttribute("aria-hidden", "true");
}
crossword.appendChild(cell);
}
}
Object.entries(entries).forEach(([entryId, entry]) => {
const figure = document.createElement("figure");
figure.className = `image-card ${entryId}`;
figure.innerHTML = `
<div class="image-frame">
<img alt="" decoding="async" referrerpolicy="no-referrer">
<span class="image-placeholder">${entry.answer.length}文字で表示</span>
<span class="image-spinner" aria-hidden="true"></span>
</div>
<figcaption>
<span class="clue-number">${entry.number}</span>
<span class="image-word">未入力</span>
<a class="image-source" target="_blank" rel="noopener noreferrer" hidden>出典</a>
</figcaption>
`;
crosswordStage.appendChild(figure);
imageCards.set(entryId, {
figure,
image: figure.querySelector("img"),
placeholder: figure.querySelector(".image-placeholder"),
word: figure.querySelector(".image-word"),
source: figure.querySelector(".image-source")
});
});
function normalizeText(value) {
return Array.from(value.replace(/[\s　]/g, ""));
}
function getEntryCharacters(entryId) {
const input = document.querySelector(`[data-entry="${entryId}"]`);
return normalizeText(input.value);
}
function updateBoard() {
const valuesByCell = new Map();
Object.entries(entries).forEach(([entryId, entry]) => {
const characters = getEntryCharacters(entryId);
entry.cells.forEach(([row, column], index) => {
const key = `${row}-${column}`;
const char = characters[index] ?? "";
if (!char) return;
if (!valuesByCell.has(key)) valuesByCell.set(key, []);
valuesByCell.get(key).push(char);
});
});
cellElements.forEach(({ cell, letter }, key) => {
const values = valuesByCell.get(key) ?? [];
const unique = [...new Set(values)];
cell.classList.toggle("conflict", unique.length > 1);
letter.textContent = unique.length === 0 ? "" : unique.length === 1 ? unique[0] : "？";
});
}
function updateInputState(input) {
const entryId = input.dataset.entry;
const entry = entries[entryId];
const characters = normalizeText(input.value);
const maxLength = entry.answer.length;
if (characters.length > maxLength) {
input.value = characters.slice(0, maxLength).join("");
}
const current = normalizeText(input.value);
document.getElementById(`count-${entryId}`).textContent = `${current.length}/${maxLength}`;
const filled = current.length === maxLength;
const correct = current.join("") === entry.answer;
input.classList.toggle("complete", filled && correct);
input.classList.toggle("wrong", filled && !correct);
}
function updateStatus() {
const allFilled = inputs.every(input => {
const entry = entries[input.dataset.entry];
return normalizeText(input.value).length === entry.answer.length;
});
const allCorrect = inputs.every(input => {
const entry = entries[input.dataset.entry];
return normalizeText(input.value).join("") === entry.answer;
});
status.classList.toggle("clear", allCorrect);
if (allCorrect) {
status.textContent = "クリア！ すべての答えが正解です。";
} else if (allFilled) {
status.textContent = "交差する文字や答えをもう一度確認してください。";
} else {
status.textContent = "カギの入力欄は、指定された文字数まで入力できます。";
}
}
function refresh() {
inputs.forEach(updateInputState);
updateBoard();
updateStatus();
}
function extractContextKeywords(clue) {
const stopWords = [
"もの", "こと", "ため", "代表的", "人気", "外来語", "表す", "使う",
"する", "した", "いる", "ある", "なる", "これ", "それ", "とき"
];
let cleaned = clue
.replace(/[「」『』【】（）()、。・！？!?]/g, " ")
.replace(/(を|に|で|と|が|は|の|へ|や|から|まで|より)/g, " ");
stopWords.forEach(word => {
cleaned = cleaned.split(word).join(" ");
});
const words = cleaned
.split(/\s+/)
.map(word => word.trim())
.filter(word => word.length >= 2);
return [...new Set(words)].slice(0, 5);
}
function stripHtml(html) {
const documentFragment = new DOMParser().parseFromString(html || "", "text/html");
return documentFragment.body.textContent || "";
}
function normalizeSearchText(value) {
return String(value || "")
.toLowerCase()
.replace(/[\s　・･「」『』【】（）()\[\]、。,.!！?？_-]/g, "");
}
function scoreResult(title, body, query, clue) {
const normalizedTitle = normalizeSearchText(title);
const normalizedBody = normalizeSearchText(body);
const normalizedQuery = normalizeSearchText(query);
const keywords = extractContextKeywords(clue).map(normalizeSearchText);
let score = 0;
if (normalizedTitle === normalizedQuery) score += 300;
if (normalizedTitle === `${normalizedQuery}のイラスト`) score += 280;
if (normalizedTitle.startsWith(normalizedQuery)) score += 180;
if (normalizedTitle.includes(normalizedQuery)) score += 120;
if (normalizedBody.includes(normalizedQuery)) score += 45;
keywords.forEach(keyword => {
if (normalizedTitle.includes(keyword)) score += 45;
if (normalizedBody.includes(keyword)) score += 12;
});
if (normalizedTitle.includes("まとめ")) score -= 20;
if (normalizedTitle.includes("セット")) score -= 10;
return score;
}
function setCardEmpty(entryId, message) {
const card = imageCards.get(entryId);
card.figure.classList.remove("loading", "ready");
card.image.removeAttribute("src");
card.placeholder.textContent = message;
card.word.textContent = "未入力";
card.source.hidden = true;
card.source.removeAttribute("href");
card.source.textContent = "";
}
function setCardLoading(entryId, query) {
const card = imageCards.get(entryId);
card.figure.classList.remove("ready");
card.figure.classList.add("loading");
card.image.removeAttribute("src");
card.word.textContent = query;
card.source.hidden = true;
}
function showImageResult(entryId, query, result) {
const card = imageCards.get(entryId);
card.figure.classList.remove("loading", "ready");
card.word.textContent = query;
if (!result) {
card.image.removeAttribute("src");
card.placeholder.textContent = "画像なし";
card.source.hidden = true;
return;
}
card.image.onload = () => {
card.figure.classList.add("ready");
};
card.image.onerror = () => {
card.figure.classList.remove("ready");
card.placeholder.textContent = "読込失敗";
card.source.hidden = true;
};
card.image.src = result.imageUrl;
card.image.alt = `${query}の検索画像`;
card.source.href = result.pageUrl;
card.source.textContent = result.sourceName;
card.source.hidden = false;
}
function jsonpRequest(url, timeoutMs = 8500) {
return new Promise((resolve, reject) => {
const callbackName = `irasutoyaJsonp_${Date.now()}_${Math.random().toString(36).slice(2)}`;
const script = document.createElement("script");
let settled = false;
const cleanup = () => {
if (script.parentNode) script.parentNode.removeChild(script);
try { delete window[callbackName]; } catch (_) { window[callbackName] = undefined; }
};
const timer = window.setTimeout(() => {
if (settled) return;
settled = true;
cleanup();
reject(new Error("いらすとや検索がタイムアウトしました"));
}, timeoutMs);
window[callbackName] = data => {
if (settled) return;
settled = true;
window.clearTimeout(timer);
cleanup();
resolve(data);
};
script.onerror = () => {
if (settled) return;
settled = true;
window.clearTimeout(timer);
cleanup();
reject(new Error("いらすとや検索を読み込めませんでした"));
};
const separator = url.includes("?") ? "&" : "?";
script.src = `${url}${separator}alt=json-in-script&callback=${encodeURIComponent(callbackName)}`;
document.head.appendChild(script);
});
}
function getEntryPageUrl(feedEntry) {
const link = (feedEntry.link || []).find(item => item.rel === "alternate");
return link?.href || "https://www.irasutoya.com/";
}
function getIrasutoyaImageUrl(feedEntry) {
const html = feedEntry.content?.$t || feedEntry.summary?.$t || "";
const parsed = new DOMParser().parseFromString(html, "text/html");
const image = parsed.querySelector("img[src]");
let imageUrl = image?.getAttribute("src") || feedEntry.media$thumbnail?.url || "";
if (!imageUrl) return "";
if (imageUrl.startsWith("//")) imageUrl = `https:${imageUrl}`;
imageUrl = imageUrl.replace(/\/s\d+(?:-c)?\//, "/s500/");
return imageUrl;
}
function toHiragana(value) {
return value.normalize("NFKC").replace(/[ァ-ヶ]/g, character =>
String.fromCharCode(character.charCodeAt(0) - 0x60)
);
}
function toKatakana(value) {
return value.normalize("NFKC").replace(/[ぁ-ゖ]/g, character =>
String.fromCharCode(character.charCodeAt(0) + 0x60)
);
}
function uniqueSearchTerms(terms) {
const seen = new Set();
const results = [];
terms.forEach(term => {
const cleaned = String(term || "")
.normalize("NFKC")
.replace(/[「」『』【】]/g, "")
.replace(/\s+/g, " ")
.trim();
const key = normalizeSearchText(cleaned);
if (!cleaned || !key || seen.has(key)) return;
seen.add(key);
results.push(cleaned);
});
return results;
}
function buildLocalNotationVariants(query) {
const normalized = String(query || "").normalize("NFKC").trim();
return uniqueSearchTerms([
normalized,
toHiragana(normalized),
toKatakana(normalized)
]);
}
function stripWikipediaQualifier(title) {
return String(title || "")
.replace(/\s*[（(][^）)]*[）)]\s*$/, "")
.trim();
}
async function discoverWikipediaNotationVariants(query, clue, signal) {
const searches = uniqueSearchTerms([query, buildContextQuery(query, clue)]);
const candidates = [];
for (const searchText of searches) {
const params = new URLSearchParams({
action: "query",
list: "search",
srsearch: searchText,
srnamespace: "0",
srlimit: "12",
srprop: "snippet",
format: "json",
formatversion: "2",
origin: "*"
});
const data = await fetchJson(`https://ja.wikipedia.org/w/api.php?${params}`, signal);
(data.query?.search || []).forEach((item, index) => {
const title = stripWikipediaQualifier(item.title);
if (!title || title.length > 16 || /一覧|曖昧さ回避/.test(title)) return;
const body = stripHtml(item.snippet || "");
candidates.push({
title,
index,
score: scoreResult(item.title, body, query, clue)
});
});
if (candidates.length >= 8) break;
}
candidates.sort((left, right) => right.score - left.score || left.index - right.index);
const bestTitles = candidates
.filter(candidate => candidate.score >= 35)
.slice(0, 5)
.map(candidate => candidate.title);
return uniqueSearchTerms(bestTitles.flatMap(title => [
title,
toHiragana(title),
toKatakana(title)
]));
}
async function searchIrasutoyaOnce(searchTerm, originalQuery, clue) {
const endpoint = new URL("https://www.irasutoya.com/feeds/posts/default");
endpoint.searchParams.set("max-results", "20");
endpoint.searchParams.set("q", searchTerm);
endpoint.searchParams.set("by-date", "false");
const data = await jsonpRequest(endpoint.toString(), 5500);
const feedEntries = data?.feed?.entry || [];
const ranked = feedEntries
.map((feedEntry, index) => {
const title = feedEntry.title?.$t || "";
const html = feedEntry.content?.$t || feedEntry.summary?.$t || "";
const body = stripHtml(html);
return {
feedEntry,
index,
score: Math.max(
scoreResult(title, body, searchTerm, clue),
scoreResult(title, body, originalQuery, clue)
)
};
})
.filter(candidate => candidate.score >= 45)
.sort((left, right) => right.score - left.score || left.index - right.index);
for (const candidate of ranked) {
const imageUrl = getIrasutoyaImageUrl(candidate.feedEntry);
if (!imageUrl) continue;
return {
imageUrl,
pageUrl: getEntryPageUrl(candidate.feedEntry),
sourceName: "いらすとや"
};
}
return null;
}
async function searchIrasutoya(query, clue, signal) {
const tried = new Set();
const tryTerms = async terms => {
for (const searchTerm of terms) {
if (signal?.aborted) throw new DOMException("Aborted", "AbortError");
const key = normalizeSearchText(searchTerm);
if (!key || tried.has(key)) continue;
tried.add(key);
const result = await searchIrasutoyaOnce(searchTerm, query, clue);
if (result) return result;
}
return null;
};
let result = await tryTerms(buildLocalNotationVariants(query));
if (result) return result;
const discoveredVariants = await discoverWikipediaNotationVariants(query, clue, signal);
result = await tryTerms(discoveredVariants);
return result;
}
async function fetchJson(url, signal) {
const response = await fetch(url, {
mode: "cors",
credentials: "omit",
signal
});
if (!response.ok) throw new Error(`HTTP ${response.status}`);
return response.json();
}
function buildContextQuery(query, clue) {
const keywords = extractContextKeywords(clue);
return [query, ...keywords].join(" ");
}
async function searchWikipediaOnce(searchText, query, clue, signal) {
const params = new URLSearchParams({
action: "query",
generator: "search",
gsrsearch: searchText,
gsrnamespace: "0",
gsrlimit: "12",
prop: "pageimages|info|extracts",
piprop: "thumbnail",
pithumbsize: "480",
inprop: "url",
exintro: "1",
explaintext: "1",
exchars: "500",
format: "json",
formatversion: "2",
origin: "*"
});
const data = await fetchJson(`https://ja.wikipedia.org/w/api.php?${params}`, signal);
const pages = (data.query?.pages || [])
.filter(page => page.thumbnail?.source)
.map((page, index) => ({
page,
index,
score: scoreResult(page.title, page.extract || "", query, clue)
}))
.sort((left, right) => right.score - left.score || left.index - right.index);
const selected = pages[0]?.page;
if (!selected) return null;
return {
imageUrl: selected.thumbnail.source,
pageUrl: selected.fullurl || `https://ja.wikipedia.org/wiki/${encodeURIComponent(selected.title)}`,
sourceName: "Wikipedia"
};
}
async function searchWikipedia(query, clue, signal) {
const contextQuery = buildContextQuery(query, clue);
let result = await searchWikipediaOnce(contextQuery, query, clue, signal);
if (!result && contextQuery !== query) {
result = await searchWikipediaOnce(query, query, clue, signal);
}
return result;
}
async function searchCommonsOnce(searchText, query, clue, signal) {
const params = new URLSearchParams({
action: "query",
generator: "search",
gsrsearch: searchText,
gsrnamespace: "6",
gsrlimit: "20",
prop: "imageinfo",
iiprop: "url|mime|extmetadata",
iiurlwidth: "480",
format: "json",
formatversion: "2",
origin: "*"
});
const data = await fetchJson(`https://commons.wikimedia.org/w/api.php?${params}`, signal);
const candidates = [];
for (const [index, page] of (data.query?.pages || []).entries()) {
const imageInfo = page.imageinfo?.[0];
if (!imageInfo?.mime?.startsWith("image/")) continue;
const imageUrl = imageInfo.thumburl || imageInfo.url;
if (!imageUrl) continue;
const metadata = imageInfo.extmetadata || {};
const body = [
metadata.ImageDescription?.value,
metadata.ObjectName?.value,
metadata.Categories?.value
].filter(Boolean).map(stripHtml).join(" ");
candidates.push({
page,
imageInfo,
imageUrl,
index,
score: scoreResult(page.title, body, query, clue)
});
}
candidates.sort((left, right) => right.score - left.score || left.index - right.index);
const selected = candidates[0];
if (!selected) return null;
return {
imageUrl: selected.imageUrl,
pageUrl: selected.imageInfo.descriptionurl || `https://commons.wikimedia.org/wiki/${encodeURIComponent(selected.page.title)}`,
sourceName: "Wikimedia Commons"
};
}
async function searchCommons(query, clue, signal) {
const contextQuery = buildContextQuery(query, clue);
let result = await searchCommonsOnce(contextQuery, query, clue, signal);
if (!result && contextQuery !== query) {
result = await searchCommonsOnce(query, query, clue, signal);
}
return result;
}
async function findImage(query, clue, signal) {
const cacheKey = `${query}\n${clue}`;
if (searchCache.has(cacheKey)) return searchCache.get(cacheKey);
let result = null;
try {
result = await searchIrasutoya(query, clue, signal);
} catch (error) {
console.warn("いらすとや検索に失敗しました", error);
}
if (!result) {
try {
result = await searchWikipedia(query, clue, signal);
} catch (error) {
if (error.name === "AbortError") throw error;
console.warn("Wikipedia検索に失敗しました", error);
}
}
if (!result) {
try {
result = await searchCommons(query, clue, signal);
} catch (error) {
if (error.name === "AbortError") throw error;
console.warn("Wikimedia Commons検索に失敗しました", error);
}
}
searchCache.set(cacheKey, result);
return result;
}
function cancelSearch(entryId) {
const state = searchStates.get(entryId);
if (!state) return;
window.clearTimeout(state.delayTimer);
window.clearTimeout(state.timeoutTimer);
state.controller?.abort();
searchStates.delete(entryId);
}
function scheduleImageSearch(input) {
const entryId = input.dataset.entry;
const entry = entries[entryId];
const query = normalizeText(input.value).join("");
cancelSearch(entryId);
if (normalizeText(input.value).length !== entry.answer.length) {
setCardEmpty(entryId, `${entry.answer.length}文字で表示`);
return;
}
const state = {
requestId: Symbol(entryId),
delayTimer: 0,
timeoutTimer: 0,
controller: null,
timedOut: false
};
searchStates.set(entryId, state);
state.delayTimer = window.setTimeout(async () => {
const currentState = searchStates.get(entryId);
if (currentState !== state) return;
setCardLoading(entryId, query);
state.controller = new AbortController();
state.timeoutTimer = window.setTimeout(() => {
state.timedOut = true;
state.controller?.abort();
}, 18000);
try {
const result = await findImage(query, entry.clue, state.controller.signal);
if (searchStates.get(entryId) !== state) return;
showImageResult(entryId, query, result);
} catch (error) {
if (searchStates.get(entryId) !== state) return;
showImageResult(entryId, query, null);
} finally {
window.clearTimeout(state.timeoutTimer);
if (searchStates.get(entryId) === state) searchStates.delete(entryId);
}
}, 500);
}
inputs.forEach(input => {
input.addEventListener("input", event => {
refresh();
if (!event.isComposing) scheduleImageSearch(input);
});
input.addEventListener("compositionend", () => {
refresh();
scheduleImageSearch(input);
});
});
resetButton.addEventListener("click", () => {
inputs.forEach(input => {
cancelSearch(input.dataset.entry);
input.value = "";
setCardEmpty(input.dataset.entry, `${entries[input.dataset.entry].answer.length}文字で表示`);
});
refresh();
inputs[0].focus();
});
refresh();
</script>
