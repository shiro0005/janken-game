<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>クロスワードクイズ</title><script>(()=>{const ok=location.protocol==='file:'||sessionStorage.getItem('game3Unlocked')==='true';if(!ok)location.replace('../')})()</script><style>
:root{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",system-ui,sans-serif;color:#202124;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px}button,input{font:inherit}.page{width:min(1220px,100%);margin:auto}.heading{text-align:center;margin-bottom:20px}h1{margin:0 0 8px;font-size:clamp(28px,5vw,44px)}.instruction,.note,.status{margin:0;color:#69727d;font-size:14px;line-height:1.65}.panel{padding:24px;border-radius:24px;background:#fff;box-shadow:0 18px 50px #23375024}.layout{display:grid;grid-template-columns:minmax(220px,1fr) minmax(500px,560px) minmax(220px,1fr);gap:24px;align-items:start}.clues{min-width:0;padding:18px;border:1px solid #dde3ec;border-radius:18px;background:#fafbfd}.clues h2{margin:0 0 14px;font-size:24px}.clue{padding:0 0 14px;margin:0 0 14px;border-bottom:1px solid #e3e7ed}.clue:last-child{padding:0;margin:0;border:0}.label{display:block;margin-bottom:8px;line-height:1.55}.num{display:inline-grid;place-items:center;min-width:26px;height:26px;margin-right:6px;padding:0 5px;border-radius:999px;background:#e8eef7;font-weight:800}.answer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.answer input{width:100%;min-width:0;padding:10px 12px;border:2px solid #cfd7e3;border-radius:12px;background:#fff;font-size:18px}.answer input:focus{border-color:#4b7bec;outline:3px solid #4b7bec2e}.answer input.ok{border-color:#5aa96f;background:#f5fbf7}.answer input.ng{border-color:#d66b62;background:#fff8f7}.count{min-width:44px;color:#69727d;font-size:13px;text-align:right}.board-area{display:grid;justify-items:center;gap:14px}.board-area h2{margin:0;color:#5f6975;font-size:18px}.stage{display:grid;grid-template-columns:104px auto 104px;grid-template-rows:118px auto 118px;gap:10px;width:min(100%,560px);align-items:center;justify-items:center}.grid{grid-column:2;grid-row:2;z-index:2;display:grid;grid-template-columns:repeat(5,minmax(44px,58px));grid-template-rows:repeat(6,minmax(44px,58px));gap:3px;padding:10px;border-radius:16px;background:#263238}.cell{position:relative;display:grid;place-items:center;border-radius:5px;background:#fff;font-size:clamp(22px,4vw,31px);font-weight:800}.cell.block{background:#263238}.cell.conflict{background:#ffe2df;color:#b3261e}.cell small{position:absolute;top:3px;left:4px;color:#59636f;font-size:10px}.pic{z-index:3;width:104px;margin:0;padding:6px;border:1px solid #d9e0e9;border-radius:14px;background:#fff;box-shadow:0 8px 20px #2337501f;overflow:hidden}.pic.a1{grid-column:2;grid-row:1}.pic.d1{grid-column:1;grid-row:2;align-self:start;margin-top:5px}.pic.a2{grid-column:3;grid-row:2;align-self:start;margin-top:58px}.pic.d2{grid-column:3;grid-row:2;align-self:end;margin-bottom:6px}.pic.a3{grid-column:2;grid-row:3}.frame{width:90px;height:68px;display:grid;place-items:center;border-radius:10px;background:#eef2f7;overflow:hidden}.frame img{display:none;width:100%;height:100%;object-fit:cover}.pic.ready img{display:block}.placeholder{padding:5px;color:#788390;font-size:12px;font-weight:800;text-align:center}.pic.ready .placeholder,.pic.loading .placeholder{display:none}.spin{display:none;width:24px;height:24px;border:3px solid #4b7bec33;border-top-color:#4b7bec;border-radius:50%;animation:spin .75s linear infinite}.pic.loading .spin{display:block}@keyframes spin{to{transform:rotate(360deg)}}figcaption{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px;align-items:center;margin-top:5px;font-size:11px}.word{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}.source{grid-column:1/-1;justify-self:end;color:#4b66a5;font-size:10px}.note{max-width:540px;font-size:12px;text-align:center}.status{min-height:24px;text-align:center}.status.clear{color:#188038;font-weight:800}.controls{text-align:center;margin-top:22px}.controls button{border:0;border-radius:12px;padding:11px 22px;background:#eef2f7;color:#4f5a67;font-weight:700;cursor:pointer}
@media(max-width:1080px){.layout{grid-template-columns:1fr 1fr}.board-area{grid-column:1/-1;grid-row:1}}@media(max-width:620px){body{padding:14px}.panel{padding:16px}.layout{grid-template-columns:1fr}.board-area{grid-column:auto;grid-row:auto}.stage{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto;width:100%}.grid{grid-column:1/-1;grid-row:1;grid-template-columns:repeat(5,minmax(42px,54px));grid-template-rows:repeat(6,minmax(42px,54px))}.pic{width:100%;display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;align-items:center}.frame{width:76px;height:62px}.pic.a1,.pic.d1,.pic.a2,.pic.d2,.pic.a3{grid-column:auto;grid-row:auto;align-self:auto;margin:0}.pic.a1,.pic.a2{grid-column:1}.pic.d1,.pic.d2{grid-column:2}.pic.a3{grid-column:1/-1;width:calc(50% - 5px);justify-self:center}figcaption{margin:0}}@media(max-width:370px){.grid{grid-template-columns:repeat(5,40px);grid-template-rows:repeat(6,40px);gap:2px;padding:7px}}
</style></head><body><main class="page"><header class="heading"><h1>クロスワードクイズ</h1><p class="instruction">カギに合う言葉を入力してください。入力した文字は中央のパズルへ反映されます。</p></header><section class="panel"><div class="layout" id="layout"></div><div class="controls"><button id="reset" type="button">入力をリセット</button></div></section></main><script>
const E={a1:{n:1,d:'a',clue:'春に咲く代表的な花',ans:'さくら',cells:[[0,1],[0,2],[0,3]]},d1:{n:2,d:'d',clue:'道路を走る乗り物',ans:'くるま',cells:[[0,2],[1,2],[2,2]]},a2:{n:3,d:'a',clue:'寿司や刺身で人気の赤身魚',ans:'まぐろ',cells:[[2,2],[2,3],[2,4]]},d2:{n:4,d:'d',clue:'火をつけて明かりにするもの',ans:'ろうそく',cells:[[2,4],[3,4],[4,4],[5,4]]},a3:{n:5,d:'a',clue:'牛乳を表す外来語',ans:'みるく',cells:[[5,2],[5,3],[5,4]]}};
const nums={'0-1':1,'0-2':2,'2-2':3,'2-4':4,'5-2':5},layout=document.querySelector('#layout'),cards=new Map,states=new Map,cache=new Map,cells=new Map;
const norm=v=>Array.from(v.replace(/[\s　]/g,''));
function cluePanel(dir,title){const s=document.createElement('section');s.className='clues';s.innerHTML=`<h2>${title}</h2>`;Object.entries(E).filter(([,e])=>e.d===dir).forEach(([id,e])=>{const x=document.createElement('div');x.className='clue';x.innerHTML=`<label class="label" for="${id}"><span class="num">${e.n}</span>${e.clue}</label><div class="answer"><input id="${id}" maxlength="${e.ans.length}" autocomplete="off" data-id="${id}"><span class="count" id="c-${id}">0/${e.ans.length}</span></div>`;s.append(x)});return s}
const board=document.createElement('section');board.className='board-area';board.innerHTML='<h2>パズル</h2><div class="stage" id="stage"><div class="grid" id="grid" role="grid"></div></div><p class="note">指定文字数に達すると、その言葉の画像をWikipedia／Wikimedia Commonsから自動検索します。正解かどうかに関係なく検索されます。</p><p class="status" id="status">指定された文字数まで入力できます。</p>';
layout.append(cluePanel('a','ヨコのカギ'),board,cluePanel('d','タテのカギ'));const stage=document.querySelector('#stage'),grid=document.querySelector('#grid'),status=document.querySelector('#status'),inputs=[...document.querySelectorAll('input[data-id]')],active=new Set;
Object.values(E).forEach(e=>e.cells.forEach(([r,c])=>active.add(`${r}-${c}`)));for(let r=0;r<6;r++)for(let c=0;c<5;c++){const k=`${r}-${c}`,x=document.createElement('div');x.className=active.has(k)?'cell':'cell block';if(active.has(k)){if(nums[k])x.innerHTML=`<small>${nums[k]}</small>`;const l=document.createElement('span');x.append(l);cells.set(k,{x,l})}grid.append(x)}
Object.entries(E).forEach(([id,e])=>{const f=document.createElement('figure');f.className=`pic ${id}`;f.innerHTML=`<div class="frame"><img alt="" decoding="async"><span class="placeholder">${e.ans.length}文字で表示</span><span class="spin"></span></div><figcaption><span class="num">${e.n}</span><span class="word">未入力</span><a class="source" target="_blank" rel="noopener" hidden>出典</a></figcaption>`;stage.append(f);cards.set(id,{f,img:f.querySelector('img'),ph:f.querySelector('.placeholder'),word:f.querySelector('.word'),src:f.querySelector('.source')})});
function boardUpdate(){const m=new Map;Object.entries(E).forEach(([id,e])=>norm(document.querySelector('#'+id).value).forEach((ch,i)=>{const p=e.cells[i];if(!p)return;const k=p.join('-');if(!m.has(k))m.set(k,[]);m.get(k).push(ch)}));cells.forEach(({x,l},k)=>{const u=[...new Set(m.get(k)||[])];x.classList.toggle('conflict',u.length>1);l.textContent=u.length===1?u[0]:u.length?'？':''})}
function inputUpdate(i){const e=E[i.dataset.id],a=norm(i.value);if(a.length>e.ans.length)i.value=a.slice(0,e.ans.length).join('');const v=norm(i.value);document.querySelector('#c-'+i.dataset.id).textContent=`${v.length}/${e.ans.length}`;i.classList.toggle('ok',v.join('')===e.ans);i.classList.toggle('ng',v.length===e.ans.length&&v.join('')!==e.ans)}
function statusUpdate(){const full=inputs.every(i=>norm(i.value).length===E[i.dataset.id].ans.length),ok=inputs.every(i=>norm(i.value).join('')===E[i.dataset.id].ans);status.classList.toggle('clear',ok);status.textContent=ok?'クリア！ すべての答えが正解です。':full?'交差する文字や答えを確認してください。':'指定された文字数まで入力できます。'}
function refresh(){inputs.forEach(inputUpdate);boardUpdate();statusUpdate()}
function clearCard(id,msg){const c=cards.get(id);c.f.classList.remove('loading','ready');c.img.removeAttribute('src');c.ph.textContent=msg;c.word.textContent='未入力';c.src.hidden=true;c.src.removeAttribute('href')}
function loading(id,q){const c=cards.get(id);c.f.classList.remove('ready');c.f.classList.add('loading');c.img.removeAttribute('src');c.word.textContent=q;c.src.hidden=true}
function result(id,q,r){const c=cards.get(id);c.f.classList.remove('loading');c.word.textContent=q;if(!r){c.f.classList.remove('ready');c.ph.textContent='画像なし';c.src.hidden=true;return}c.img.onload=()=>c.f.classList.add('ready');c.img.onerror=()=>{c.f.classList.remove('ready');c.ph.textContent='読込失敗';c.src.hidden=true};c.img.src=r.url;c.img.alt=q+'の検索画像';c.src.href=r.page;c.src.hidden=false}
async function json(url,signal){const r=await fetch(url,{mode:'cors',credentials:'omit',signal});if(!r.ok)throw Error(r.status);return r.json()}
async function wiki(q,s){const p=new URLSearchParams({action:'query',generator:'search',gsrsearch:q,gsrnamespace:'0',gsrlimit:'8',prop:'pageimages|info',piprop:'thumbnail',pithumbsize:'420',inprop:'url',format:'json',formatversion:'2',origin:'*'}),d=await json('https://ja.wikipedia.org/w/api.php?'+p,s),a=(d.query?.pages||[]).filter(x=>x.thumbnail?.source).sort((x,y)=>(x.index||999)-(y.index||999)),x=a[0];return x?{url:x.thumbnail.source,page:x.fullurl||'https://ja.wikipedia.org/wiki/'+encodeURIComponent(x.title)}:null}
async function commons(q,s){const p=new URLSearchParams({action:'query',generator:'search',gsrsearch:q,gsrnamespace:'6',gsrlimit:'12',prop:'imageinfo',iiprop:'url|mime',iiurlwidth:'420',format:'json',formatversion:'2',origin:'*'}),d=await json('https://commons.wikimedia.org/w/api.php?'+p,s);for(const x of (d.query?.pages||[]).sort((a,b)=>(a.index||999)-(b.index||999))){const i=x.imageinfo?.[0];if(i?.mime?.startsWith('image/')&&(i.thumburl||i.url))return{url:i.thumburl||i.url,page:i.descriptionurl||'https://commons.wikimedia.org/wiki/'+encodeURIComponent(x.title)}}return null}
async function find(q,s){if(cache.has(q))return cache.get(q);let r=null;try{r=await wiki(q,s)}catch(e){if(e.name==='AbortError')throw e}if(!r)try{r=await commons(q,s)}catch(e){if(e.name==='AbortError')throw e}cache.set(q,r);return r}
function cancel(id){const s=states.get(id);if(!s)return;clearTimeout(s.wait);clearTimeout(s.limit);s.ctrl?.abort();states.delete(id)}
function search(i){const id=i.dataset.id,e=E[id],q=norm(i.value).join('');cancel(id);if(norm(i.value).length!==e.ans.length){clearCard(id,e.ans.length+'文字で表示');return}const s={q,wait:0,limit:0,timeout:false,ctrl:null};s.wait=setTimeout(async()=>{s.ctrl=new AbortController;s.limit=setTimeout(()=>{s.timeout=true;s.ctrl.abort()},9000);loading(id,q);try{const r=await find(q,s.ctrl.signal);if(states.get(id)===s&&norm(i.value).join('')===q)result(id,q,r)}catch(err){if((err.name!=='AbortError'||s.timeout)&&norm(i.value).join('')===q)result(id,q,null)}finally{clearTimeout(s.limit)}},500);states.set(id,s)}
inputs.forEach(i=>{i.addEventListener('input',e=>{refresh();if(!e.isComposing)search(i)});i.addEventListener('compositionend',()=>{refresh();search(i)})});document.querySelector('#reset').onclick=()=>{inputs.forEach(i=>{cancel(i.dataset.id);i.value='';clearCard(i.dataset.id,E[i.dataset.id].ans.length+'文字で表示')});refresh();inputs[0].focus()};refresh();
</script></body></html>
