<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>あるなしクイズ</title>
  <script>
    (() => {
      const localPreview = window.location.protocol === "file:";
      const unlocked = localPreview || sessionStorage.getItem("game2Unlocked") === "true";
      if (!unlocked) window.location.replace("../");
    })();
  </script>
  <style>
    :root {
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
      color: #202124;
      background: #f4f7fb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      overscroll-behavior: none;
    }

    button { font: inherit; }

    .page {
      width: min(980px, 100%);
      margin: 0 auto;
    }

    .heading {
      margin-bottom: 18px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 44px);
    }

    .instruction {
      margin: 0;
      color: #69727d;
      font-size: 14px;
      line-height: 1.7;
    }

    .game-panel {
      position: relative;
      padding: 26px;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 18px 50px rgba(35, 55, 80, 0.14);
      overflow: hidden;
    }

    .zones {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .drop-zone {
      min-height: 285px;
      padding: 18px;
      border: 3px dashed #cbd3df;
      border-radius: 22px;
      background: #fafbfd;
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }

    .drop-zone[data-zone="ari"] {
      border-color: #8bc4a0;
      background: #f5fbf7;
    }

    .drop-zone[data-zone="nashi"] {
      border-color: #e1a5a0;
      background: #fff8f7;
    }

    .drop-zone.drag-over {
      transform: scale(1.01);
      border-style: solid;
    }

    .zone-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .zone-title {
      margin: 0;
      font-size: 30px;
      letter-spacing: .08em;
    }

    .zone-count {
      min-width: 54px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.82);
      color: #59636f;
      font-weight: 700;
      text-align: center;
    }

    .zone-items {
      display: grid;
      grid-template-columns: repeat(3, minmax(76px, 1fr));
      gap: 12px;
      min-height: 190px;
      align-content: start;
    }

    .piece-field {
      position: relative;
      min-height: 300px;
      margin-top: 26px;
      border-radius: 18px;
      background:
        radial-gradient(circle at 16% 26%, rgba(219,228,240,.45), transparent 25%),
        radial-gradient(circle at 80% 68%, rgba(219,228,240,.45), transparent 27%);
      overflow: hidden;
    }

    .piece-field.drag-over {
      outline: 3px dashed #bcc7d6;
      outline-offset: -8px;
    }

    .piece-field-label {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 0;
      transform: translate(-50%, -50%);
      color: #d2d8e1;
      font-size: clamp(20px, 5vw, 34px);
      font-weight: 800;
      letter-spacing: .12em;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
    }

    .piece {
      position: absolute;
      z-index: 2;
      width: 86px;
      height: 86px;
      display: grid;
      place-items: center;
      padding: 8px;
      border: 2px solid #dce2ea;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 8px 18px rgba(42,58,78,.12);
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      transition: box-shadow .15s ease, transform .15s ease;
    }

    .piece:hover { box-shadow: 0 12px 24px rgba(42,58,78,.17); }

    .piece:active,
    .piece.dragging {
      cursor: grabbing;
      box-shadow: 0 18px 34px rgba(42,58,78,.24);
      transition: none;
    }

    .piece-icon {
      width: 66px;
      height: 66px;
      display: grid;
      place-items: center;
      font-size: 50px;
      line-height: 1;
      pointer-events: none;
    }

    .piece-icon svg,
    .piece-icon img {
      display: block;
      width: 66px;
      height: 66px;
      object-fit: contain;
      overflow: hidden;
      pointer-events: none;
    }

    .zone-items .piece {
      position: relative;
      inset: auto !important;
      width: 100%;
      height: 86px;
      transform: none !important;
    }

    .controls {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    .reset-button {
      border: 0;
      border-radius: 12px;
      padding: 11px 22px;
      background: #eef2f7;
      color: #4f5a67;
      font-weight: 700;
      cursor: pointer;
    }

    .clear-overlay {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(244,247,251,.88);
      backdrop-filter: blur(5px);
    }

    .clear-card {
      width: min(420px, 100%);
      padding: 36px 28px;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 20px 60px rgba(35,55,80,.22);
      text-align: center;
    }

    .clear-title {
      margin: 0 0 10px;
      color: #188038;
      font-size: 38px;
    }

    .clear-text {
      margin: 0;
      color: #5f6975;
      line-height: 1.7;
    }

    .transition-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
      padding: 10px 14px;
      border-radius: 999px;
      background: #eef4ff;
      color: #315b9d;
      font-size: 14px;
      font-weight: 800;
    }

    .transition-spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(49, 91, 157, .22);
      border-top-color: #315b9d;
      border-radius: 50%;
      animation: transition-spin .75s linear infinite;
    }

    @keyframes transition-spin {
      to { transform: rotate(360deg); }
    }

    .hidden { display: none !important; }

    @media (max-width: 700px) {
      body { padding: 14px; }
      .game-panel { padding: 16px; }
      .zones { gap: 12px; }
      .drop-zone { min-height: 250px; padding: 12px; }
      .zone-title { font-size: 24px; }
      .zone-items { grid-template-columns: repeat(2, minmax(64px, 1fr)); gap: 8px; }
      .piece-field { min-height: 360px; }
      .piece { width: 74px; height: 74px; border-radius: 19px; }
      .piece-icon, .piece-icon svg, .piece-icon img { width: 56px; height: 56px; font-size: 45px; }
      .zone-items .piece { height: 74px; }
    }

    @media (max-width: 430px) {
      .zones { grid-template-columns: 1fr; }
      .drop-zone { min-height: 190px; }
      .zone-items { min-height: 100px; grid-template-columns: repeat(4, minmax(52px, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="heading">
      <h1>あるなしクイズ</h1>
      <p class="instruction">イラストをドラッグして、「ある」か「なし」の枠に分けてください。</p>
    </header>

    <section class="game-panel" id="gamePanel">
      <div class="zones">
        <section class="drop-zone" data-zone="ari">
          <div class="zone-header">
            <h2 class="zone-title">ある</h2>
            <span class="zone-count" id="ariCount">0個</span>
          </div>
          <div class="zone-items" id="ariItems"></div>
        </section>

        <section class="drop-zone" data-zone="nashi">
          <div class="zone-header">
            <h2 class="zone-title">なし</h2>
            <span class="zone-count" id="nashiCount">0個</span>
          </div>
          <div class="zone-items" id="nashiItems"></div>
        </section>
      </div>

      <div class="piece-field" id="pieceField" aria-label="イラスト置き場">
        <div class="piece-field-label">イラスト置き場</div>

        <button class="piece" type="button" draggable="false" aria-label="惑星" data-piece="planet" data-answer="ari" data-x="5" data-y="8" data-r="-7">
          <span class="piece-icon">🪐</span>
        </button>

        <button class="piece" type="button" draggable="false" aria-label="流星" data-piece="meteor" data-answer="nashi" data-x="28" data-y="3" data-r="6">
          <span class="piece-icon">☄️</span>
        </button>

        <button class="piece" type="button" draggable="false" aria-label="野球" data-piece="baseball" data-answer="nashi" data-x="52" data-y="14" data-r="-3">
          <span class="piece-icon">⚾</span>
        </button>

        <button class="piece" type="button" draggable="false" aria-label="鮫" data-piece="shark" data-answer="nashi" data-x="82" data-y="5" data-r="7">
          <span class="piece-icon">🦈</span>
        </button>

        <button class="piece" type="button" draggable="false" aria-label="フェンス" data-piece="fence" data-answer="nashi" data-x="8" data-y="66" data-r="4">
          <span class="piece-icon" aria-hidden="true">
            <svg viewBox="0 0 100 80" role="img">
              <g stroke="#6b3d1f" stroke-width="4" stroke-linejoin="round">
                <path d="M12 28H88V64H12Z" fill="#a96732"/>
                <path d="M18 15L26 27V70H10V27Z" fill="#c9874e"/>
                <path d="M40 15L48 27V70H32V27Z" fill="#c9874e"/>
                <path d="M62 15L70 27V70H54V27Z" fill="#c9874e"/>
                <path d="M84 15L92 27V70H76V27Z" fill="#c9874e"/>
              </g>
            </svg>
          </span>
        </button>
        <!-- いらすとや「有刺鉄線のフェンスのイラスト」 -->
        <button class="piece" type="button" draggable="false"
          aria-label="有刺鉄線"
          data-piece="barbed-wire"
          data-answer="ari"
          data-source="irasutoya"
          data-x="35"
          data-y="72"
          data-r="-7">
          <span class="piece-icon" aria-hidden="true">
            <img
              src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEj7UBzeUtu9F2O1OP7FZUiHKZCXyCkv5XLIBCXdnVf4KgWFVI-Y9Q0ZIQJ8Lj5muwwXaRtelPkx9dzL_W4bs0KQyZ8ugUXQiZom94cDVW_KNRW7ktAqRKdM8fBsRGwuZJ3Lv9OTNxBYOhXV/s400/fence.png"
              alt=""
              decoding="async">
          </span>
        </button>
        <!-- いらすとや「マグロのイラスト」 -->
        <button class="piece" type="button" draggable="false"
          aria-label="鮪"
          data-piece="tuna"
          data-answer="ari"
          data-source="irasutoya"
          data-x="63"
          data-y="58"
          data-r="3">
          <span class="piece-icon" aria-hidden="true">
            <img
              src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjbaWSjaoSVSpg1tBWcuGzAahNsOOPgDqSf938wI_ZTjmS0rsQVGP3tIazbg-w8vW0D5vg4NVD6uwpx44GYRaH6cvHSGqPxdZxBaRKhSrrV07-wqDK2gjZZ1xz7VxG15CYbXe723F2VMYQ-/s500/fish_maguro2.png"
              alt=""
              decoding="async">
          </span>
        </button>

        <button class="piece" type="button" draggable="false" aria-label="サッカー" data-piece="soccer" data-answer="nashi" data-x="91" data-y="74" data-r="-5">
          <span class="piece-icon">⚽</span>
        </button>
      </div>

      <div class="controls">
        <button class="reset-button" id="resetButton" type="button">配置をリセット</button>
      </div>

      <div class="clear-overlay hidden" id="clearOverlay" aria-live="polite">
        <div class="clear-card" aria-busy="true">
          <h2 class="clear-title">クリア！</h2>
          <p class="clear-text">すべてのイラストを正しく分けられました。</p>
          <div class="transition-status" role="status">
            <span class="transition-spinner" aria-hidden="true"></span>
            <span>クロスワードクイズへ移動中…</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const field = document.getElementById("pieceField");
    const zones = [...document.querySelectorAll(".drop-zone")];
    const pieces = [...document.querySelectorAll(".piece")];
    const ariItems = document.getElementById("ariItems");
    const nashiItems = document.getElementById("nashiItems");
    const ariCount = document.getElementById("ariCount");
    const nashiCount = document.getElementById("nashiCount");
    const resetButton = document.getElementById("resetButton");
    const clearOverlay = document.getElementById("clearOverlay");

    let drag = null;
    let game3TransitionScheduled = false;

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function placeInField(piece, normalizedX, normalizedY) {
      const fieldRect = field.getBoundingClientRect();
      const pieceWidth = piece.offsetWidth || 86;
      const pieceHeight = piece.offsetHeight || 86;
      const padding = 10;
      const maxLeft = Math.max(padding, fieldRect.width - pieceWidth - padding);
      const maxTop = Math.max(padding, fieldRect.height - pieceHeight - padding);
      const x = clamp(Number(normalizedX), 0, 100);
      const y = clamp(Number(normalizedY), 0, 100);

      piece.dataset.currentX = String(x);
      piece.dataset.currentY = String(y);
      piece.style.position = "absolute";
      piece.style.left = `${padding + (maxLeft - padding) * (x / 100)}px`;
      piece.style.top = `${padding + (maxTop - padding) * (y / 100)}px`;
      piece.style.transform = `rotate(${piece.dataset.r}deg)`;
    }

    function placeInitial(piece) {
      placeInField(piece, piece.dataset.x, piece.dataset.y);
    }

    function updateCountsAndCheck() {
      ariCount.textContent = `${ariItems.children.length}個`;
      nashiCount.textContent = `${nashiItems.children.length}個`;

      const allPlaced = pieces.every(piece => piece.parentElement === ariItems || piece.parentElement === nashiItems);
      if (!allPlaced) return;

      const allCorrect = pieces.every(piece => {
        const actual = piece.parentElement === ariItems ? "ari" : "nashi";
        return actual === piece.dataset.answer;
      });

      if (allCorrect && !game3TransitionScheduled) {
        game3TransitionScheduled = true;
        clearOverlay.classList.remove("hidden");
        sessionStorage.setItem("game3Unlocked", "true");
        window.setTimeout(() => {
          window.location.href = "../game3/";
        }, 1800);
      }
    }

    function clearDropHighlights() {
      zones.forEach(zone => zone.classList.remove("drag-over"));
      field.classList.remove("drag-over");
    }

    function hitTarget(x, y) {
      const under = document.elementFromPoint(x, y);
      return under?.closest(".drop-zone, .piece-field") ?? null;
    }

    function returnToSource(piece, sourceParent, sourceX, sourceY) {
      sourceParent.appendChild(piece);
      if (sourceParent === field) {
        placeInField(piece, sourceX, sourceY);
      } else {
        piece.style.position = "relative";
        piece.style.left = "";
        piece.style.top = "";
        piece.style.transform = "none";
      }
    }

    function onPointerDown(event) {
      if (drag) return;
      if (event.pointerType === "mouse" && event.button !== 0) return;

      event.preventDefault();
      const piece = event.currentTarget;
      const rect = piece.getBoundingClientRect();

      drag = {
        piece,
        pointerId: event.pointerId,
        offsetX: event.clientX - rect.left,
        offsetY: event.clientY - rect.top,
        sourceParent: piece.parentElement,
        sourceX: piece.dataset.currentX ?? piece.dataset.x,
        sourceY: piece.dataset.currentY ?? piece.dataset.y
      };

      piece.classList.add("dragging");
      piece.style.position = "fixed";
      piece.style.left = `${rect.left}px`;
      piece.style.top = `${rect.top}px`;
      piece.style.width = `${rect.width}px`;
      piece.style.height = `${rect.height}px`;
      piece.style.margin = "0";
      piece.style.transform = "none";
      piece.style.zIndex = "9999";
      piece.style.pointerEvents = "none";
      document.body.appendChild(piece);
    }

    function onPointerMove(event) {
      if (!drag || event.pointerId !== drag.pointerId) return;
      event.preventDefault();

      const { piece, offsetX, offsetY } = drag;
      piece.style.left = `${event.clientX - offsetX}px`;
      piece.style.top = `${event.clientY - offsetY}px`;

      clearDropHighlights();
      hitTarget(event.clientX, event.clientY)?.classList.add("drag-over");
    }

    function restorePieceStyles(piece) {
      piece.classList.remove("dragging");
      piece.style.width = "";
      piece.style.height = "";
      piece.style.margin = "";
      piece.style.zIndex = "";
      piece.style.pointerEvents = "";
    }

    function dropInto(target, piece, clientX, clientY) {
      if (target?.classList.contains("drop-zone")) {
        const holder = target.dataset.zone === "ari" ? ariItems : nashiItems;
        holder.appendChild(piece);
        piece.style.position = "relative";
        piece.style.left = "";
        piece.style.top = "";
        piece.style.transform = "none";
        return;
      }

      if (target?.classList.contains("piece-field")) {
        field.appendChild(piece);
        const fieldRect = field.getBoundingClientRect();
        const halfW = piece.offsetWidth / 2;
        const halfH = piece.offsetHeight / 2;
        const usableW = Math.max(1, fieldRect.width - piece.offsetWidth - 20);
        const usableH = Math.max(1, fieldRect.height - piece.offsetHeight - 20);
        const left = clamp(clientX - fieldRect.left - halfW, 10, fieldRect.width - piece.offsetWidth - 10);
        const top = clamp(clientY - fieldRect.top - halfH, 10, fieldRect.height - piece.offsetHeight - 10);
        const normalizedX = ((left - 10) / usableW) * 100;
        const normalizedY = ((top - 10) / usableH) * 100;
        placeInField(piece, normalizedX, normalizedY);
        return;
      }

      returnToSource(piece, drag.sourceParent, drag.sourceX, drag.sourceY);
    }

    function finishDrag(event) {
      if (!drag || event.pointerId !== drag.pointerId) return;
      event.preventDefault();

      const { piece } = drag;
      const target = hitTarget(event.clientX, event.clientY);
      restorePieceStyles(piece);
      dropInto(target, piece, event.clientX, event.clientY);
      clearDropHighlights();
      drag = null;
      updateCountsAndCheck();
    }

    function resetGame() {
      game3TransitionScheduled = false;
      sessionStorage.removeItem("game3Unlocked");
      clearOverlay.classList.add("hidden");
      pieces.forEach(piece => {
        field.appendChild(piece);
        piece.style.width = "";
        piece.style.height = "";
        piece.style.margin = "";
        piece.style.zIndex = "";
        piece.style.pointerEvents = "";
        placeInitial(piece);
      });
      clearDropHighlights();
      updateCountsAndCheck();
    }

    pieces.forEach(piece => {
      piece.addEventListener("pointerdown", onPointerDown);
      piece.addEventListener("contextmenu", event => event.preventDefault());
    });

    document.addEventListener("pointermove", onPointerMove, { passive: false });
    document.addEventListener("pointerup", finishDrag, { passive: false });
    document.addEventListener("pointercancel", finishDrag, { passive: false });

    resetButton.addEventListener("click", resetGame);

    const resizeObserver = new ResizeObserver(() => {
      if (drag) return;
      pieces.forEach(piece => {
        if (piece.parentElement === field) {
          placeInField(
            piece,
            piece.dataset.currentX ?? piece.dataset.x,
            piece.dataset.currentY ?? piece.dataset.y
          );
        }
      });
    });

    resizeObserver.observe(field);
    requestAnimationFrame(resetGame);
  </script>
</body>
</html>
